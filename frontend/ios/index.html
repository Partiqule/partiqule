<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <!-- Primary SEO -->
    <title>Partiqule — Smarter shopping, scored</title>
    <meta name="description" content="Partiqule scores everyday products from 1 to 10 so the buying decision is clearer. Lower is safer. About 3,156 products are hand-checked. Rules read the label when they can. A model is only the fallback. One score is free, no card." />
    <script>document.title = "Partiqule — Smarter shopping, scored";</script>
    <meta name="keywords" content="product score, shopping, ingredient list, product safety, barcode, clothing label, Partiqule" />
    <meta name="author" content="Partiqule" />
    <link rel="canonical" href="https://partiqule.com" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://partiqule.com" />
    <meta property="og:title"       content="Partiqule — Smarter shopping, scored" />
    <meta property="og:description" content="Everyday products, 1 to 10. Lower is safer. A hand-checked library of about 3,156 products, rules that read the label, and the reason under the number. One score is free." />
    <meta property="og:image"       content="https://partiqule.com/og-image.png" />
    <meta property="og:site_name"   content="Partiqule" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@partiqule" />
    <meta name="twitter:title"       content="Partiqule — Smarter shopping, scored" />
    <meta name="twitter:description" content="Everyday products, 1 to 10. Lower is safer. About 3,156 are hand-checked. A model is only the fallback. One score is free." />
    <meta name="twitter:image"       content="https://partiqule.com/og-image.png" />

    <!-- Structured Data (Google Rich Results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Partiqule",
      "url": "https://partiqule.com",
      "description": "Scores everyday products from 1 to 10 so a shopping decision is clearer. Lower is safer. One score is free. A subscription is $4.99 a month.",
      "applicationCategory": "ShoppingApplication",
      "operatingSystem": "Any",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD", "description": "One score free. No card. Subscription is $4.99 a month." },
      "author": { "@type": "Organization", "name": "Partiqule" }
    }
    </script>

    <!-- Plausible Analytics (privacy-friendly, no cookies) -->
    <script defer data-domain="partiqule.com" src="https://plausible.io/js/script.tagged-events.js"></script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#052e16" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Partiqule" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
