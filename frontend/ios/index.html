<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap" rel="stylesheet"/>

    <!-- Primary SEO -->
    <title>Partiqule — Scan anything. Know everything.</title>
    <meta name="description" content="Scan any product to instantly understand what's in it — food, clothing, personal care, cleaning products, and more. AI-powered health scoring with safer alternatives." />
    <script>document.title = "Partiqule";</script>
    <meta name="keywords" content="product health scanner, microplastics, toxic chemicals, food additives, PFAS, BPA, ingredient checker, safer alternatives, clean living, product safety" />
    <meta name="author" content="Partiqule" />
    <link rel="canonical" href="https://partiqule.com" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp, iMessage) -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://partiqule.com" />
    <meta property="og:title"       content="Partiqule — Scan anything. Know everything." />
    <meta property="og:description" content="Scan any product and instantly get a health score, ingredient breakdown, and safer alternatives. Food, clothing, personal care, restaurants and more." />
    <meta property="og:image"       content="https://partiqule.com/og-image.png" />
    <meta property="og:site_name"   content="Partiqule" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@partiqule" />
    <meta name="twitter:title"       content="Partiqule — Scan anything. Know everything." />
    <meta name="twitter:description" content="Scan any product and instantly get a health score, ingredient breakdown, and safer alternatives. Food, clothing, personal care, restaurants and more." />
    <meta name="twitter:image"       content="https://partiqule.com/og-image.png" />

    <!-- Structured Data (Google Rich Results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Partiqule",
      "url": "https://partiqule.com",
      "description": "AI-powered product health scanner. Scan any product to understand its risks for you, your home, and your planet.",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "Any",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "author": { "@type": "Organization", "name": "Partiqule" }
    }
    </script>

    <!-- Plausible Analytics (privacy-friendly, no cookies) -->
    <script defer data-domain="partiqule.com" src="https://plausible.io/js/script.tagged-events.js"></script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#052e16" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Partiqule" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
