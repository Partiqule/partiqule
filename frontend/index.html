<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap" rel="stylesheet"/>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

    <!-- Primary SEO -->
    <title>Partiqule — Know What's In Your Products</title>
    <meta name="description" content="Scan any product to understand its risks for you, your home and your planet. Free, instant health scoring across materials, exposure, packaging, sustainability and manufacturing." />
    <script>document.title = "Partiqule — Know What's In Your Products";</script>
    <meta name="keywords" content="product health score, microplastics, PFAS, BPA, product safety, toxic chemicals, sustainable products, healthy home, plastic-free alternatives" />
    <meta name="author" content="Partiqule" />
    <link rel="canonical" href="https://partiqule.com" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://partiqule.com" />
    <meta property="og:title"       content="Partiqule — Know What's In Your Products" />
    <meta property="og:description" content="Scan any product to understand its risks for you, your home and your planet. AI-powered health scoring across materials, exposure, packaging and sustainability. Free, no account needed." />
    <meta property="og:image"       content="https://partiqule.com/og-image.png" />
    <meta property="og:site_name"   content="Partiqule" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@partiqule" />
    <meta name="twitter:title"       content="Partiqule — Know What's In Your Products" />
    <meta name="twitter:description" content="Scan any product to understand its risks for you, your home and your planet. Free, instant, science-backed." />
    <meta name="twitter:image"       content="https://partiqule.com/og-image.png" />

    <!-- Structured Data (Google Rich Results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Partiqule",
      "url": "https://partiqule.com",
      "description": "AI-powered product health scanner. Understand the impact of any product on your health, your home and the planet.",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "Any",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "author": { "@type": "Organization", "name": "Partiqule" }
    }
    </script>

    <!-- Plausible Analytics (privacy-friendly, no cookies) -->
    <!-- Replace YOUR_DOMAIN with your actual domain e.g. partiqule.com -->
    <script defer data-domain="partiqule.com" src="https://plausible.io/js/script.tagged-events.js"></script>

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#052e16" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Partiqule" />
  </head>

    <div id="root"></div>
