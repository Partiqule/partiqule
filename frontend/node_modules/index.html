<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&display=swap" rel="stylesheet"/>

    <!-- Primary SEO -->
    <title>Partiqule — Know What's In Your Products</title>
    <meta name="description" content="Scan any product to instantly get its microplastics risk score. Discover which everyday items contain BPA, PFAS, nylon and other harmful plastics — and find safer alternatives." />
    <meta name="keywords" content="microplastics, plastic-free, BPA free, PFAS, microplastic risk, product safety, plastic alternatives, healthy living, toxic chemicals" />
    <meta name="author" content="Partiqule" />
    <link rel="canonical" href="https://partiqule.com" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type"        content="website" />
    <meta property="og:url"         content="https://partiqule.com" />
    <meta property="og:title"       content="Partiqule — Know What's In Your Products" />
    <meta property="og:description" content="Scan any product for microplastics risk. See exactly what plastics are in your food, clothing, and personal care items — and shop safer alternatives." />
    <meta property="og:image"       content="https://partiqule.com/og-image.png" />
    <meta property="og:site_name"   content="Partiqule" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@partiqule" />
    <meta name="twitter:title"       content="Partiqule — Know What's In Your Products" />
    <meta name="twitter:description" content="Scan any product for microplastics risk. See exactly what plastics are lurking in your everyday items." />
    <meta name="twitter:image"       content="https://partiqule.com/og-image.png" />

    <!-- Structured Data (Google Rich Results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Partiqule",
      "url": "https://partiqule.com",
      "description": "AI-powered microplastics risk scanner for consumer products",
      "applicationCategory": "HealthApplication",
      "operatingSystem": "Any",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "author": { "@type": "Organization", "name": "Partiqule" }
    }
    </script>

    <!-- Plausible Analytics (privacy-friendly, no cookies) -->
    <!-- Replace YOUR_DOMAIN with your actual domain e.g. partiqule.com -->
    <script defer data-domain="partiqule.com" src="https://plausible.io/js/script.tagged-events.js"></script>

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/favicon-512.png" />
    <meta name="theme-color" content="#052e16" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
